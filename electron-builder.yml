appId: dev.webgrid.app
productName: WebGrid
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # No certificate: electron-builder skips signing and build/adhoc-sign.cjs
  # ad-hoc signs the bundle instead. CI should provide identity + notarisation.
  identity: null
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
afterPack: build/adhoc-sign.cjs
